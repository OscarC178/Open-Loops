# Runs the test suite (python tests/run_all.py, the same as `npm test`) on every pull request and on every
# push to develop, on Linux and macOS. The tests are stdlib-only and never call Slack, Gmail or Claude: each
# builds a throwaway install with its own HOME on a port the OS picks, and the Claude setup tests use a fake
# `claude` on PATH. test_macos_launch skips itself on Linux, and skips its one live check (doctor finds a real
# `claude`) where Claude Code is not installed, saying so in the log.
name: Tests

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run the suite
        run: python tests/run_all.py
